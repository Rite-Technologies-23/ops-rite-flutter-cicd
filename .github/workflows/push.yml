name: "Flutter CI Reusable Workflow"

on:
  workflow_call:
    inputs:

      flutter_version:
        required: false
        type: string
        default: "3.35.5"

      flutter_channel:
        required: false
        type: string
        default: "stable"

      coverage_threshold:
        required: false
        type: string
        default: "80"

      run_tests:
        required: false
        type: boolean
        default: true

      enforce_coverage:
        required: false
        type: boolean
        default: true

      build_ios:
        required: false
        type: boolean
        default: false

      package_name:
        required: true
        type: string

      ios_bundle_id:
        required: false
        type: string

      version_name:
        required: true
        type: string

      playstore_track:
        required: false
        type: string
        default: internal

      android_runner:
        required: false
        type: string
        default: ubuntu-latest

      ios_runner:
        required: false
        type: string
        default: macos-latest

    secrets:
      SONAR_TOKEN:
        required: false
      CODACY_PROJECT_TOKEN:
        required: false

concurrency:
  group: playstore-${{ inputs.package_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version }}
  FLUTTER_CHANNEL: ${{ inputs.flutter_channel }}
  COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}

jobs:

  ############################################################
  # BUILD SETUP
  ############################################################

  build_flutter_project:
    name: Setup Flutter Project
    runs-on: ${{ inputs.android_runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: Rite-Technologies-23/ops-rite-flutter-cicd/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Flutter Pub Get
        run: flutter pub get

  ############################################################
  # DART ANALYZER
  ############################################################

  dart_analyzer:
    name: Run Dart Analyzer
    runs-on: ${{ inputs.android_runner }}
    needs: build_flutter_project

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: Rite-Technologies-23/ops-rite-flutter-cicd/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Run Dart Analyzer
        run: |
          dart analyze > analyzer-report.txt || true

          if grep -q "error •" analyzer-report.txt; then
            echo "❌ Dart analyzer errors found"
            exit 1
          fi

      - name: Upload Analyzer Report
        uses: actions/upload-artifact@v4
        with:
          name: Dart-Analyzer-Reports
          path: analyzer-report.txt

  ############################################################
  # TESTS
  ############################################################

  run_tests:
    name: Run Flutter Tests & Coverage
    runs-on: ${{ inputs.android_runner }}
    needs: build_flutter_project
    if: ${{ inputs.run_tests }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: Rite-Technologies-23/ops-rite-flutter-cicd/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Run Flutter Tests
        run: flutter test --coverage

  ############################################################
  # ANDROID BUILD
  ############################################################

  build_android:
    name: Build Android
    runs-on: ${{ inputs.android_runner }}
    needs: dart_analyzer

    steps:
      - uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: Rite-Technologies-23/ops-rite-flutter-cicd/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --build-name=${{ inputs.version_name }} --build-number=1

      - name: Build AAB
        run: |
          flutter build appbundle --release --build-name=${{ inputs.version_name }} --build-number=1

      - name: Upload Android Outputs
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/*.aab

  ############################################################
  # IOS BUILD
  ############################################################

  build_ios:
    name: Build iOS (UNSIGNED ARCHIVE)
    runs-on: ${{ inputs.ios_runner }}
    needs: dart_analyzer
    if: ${{ inputs.build_ios }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate Bundle ID
        run: |
          if [ -z "${{ inputs.ios_bundle_id }}" ]; then
            echo "❌ ios_bundle_id required when build_ios=true"
            exit 1
          fi

      - name: Setup Flutter
        uses: Rite-Technologies-23/ops-rite-flutter-cicd/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Build iOS Archive
        run: |
          set -e
          
          ARCHIVE_DIR="$RUNNER_TEMP/ios-archive"
          ARCHIVE_PATH="$ARCHIVE_DIR/Runner.xcarchive"
          
          mkdir -p "$ARCHIVE_DIR"
          
          flutter build ios --release --no-codesign
          
          cd ios
          
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            archive
          
          cd ..
          
          test -d "$ARCHIVE_PATH"

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-unsigned
          path: ${{ runner.temp }}/ios-archive