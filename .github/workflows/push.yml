name: "Flutter CI Reusable Workflow"

on:
  workflow_call:
    inputs:

      flutter_version:
        required: false
        type: string
        default: "3.35.5"

      flutter_channel:
        required: false
        type: string
        default: "stable"

      coverage_threshold:
        required: false
        type: string
        default: "80"

      run_tests:
        required: false
        type: boolean
        default: true

      enforce_coverage:
        required: false
        type: boolean
        default: true

      build_android:
        required: false
        type: boolean
        default: false

      build_ios:
        required: false
        type: boolean
        default: false

      package_name:
        required: true
        type: string

      ios_bundle_id:
        required: false
        type: string

      version_name:
        required: true
        type: string

      playstore_track:
        required: false
        type: string
        default: internal

      android_runner:
        required: false
        type: string
        default: ubuntu-latest

      ios_runner:
        required: false
        type: string
        default: macos-latest

    secrets:
      SONAR_TOKEN:
        required: false
      CODACY_PROJECT_TOKEN:
        required: false

concurrency:
  group: playstore-${{ inputs.package_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version }}
  FLUTTER_CHANNEL: ${{ inputs.flutter_channel }}
  COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}

jobs:

  ############################################################
  # BUILD SETUP
  ############################################################

  build_flutter_project:
    name: Setup Flutter Project
    runs-on: ${{ inputs.android_runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: Rite-Technologies-23/ops-rite-flutter-cicd/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Flutter Pub Get
        run: flutter pub get

  ############################################################
  # DART ANALYZER
  ############################################################

  dart_analyzer:
    name: Run Dart Analyzer
    runs-on: ${{ inputs.android_runner }}
    needs: build_flutter_project

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: Rite-Technologies-23/ops-rite-flutter-cicd/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Run Dart Analyzer
        run: |
          dart analyze > analyzer-report.txt || true

          if grep -q "error •" analyzer-report.txt; then
            echo "❌ Dart analyzer errors found"
            exit 1
          fi

      - name: Upload Analyzer Report
        uses: actions/upload-artifact@v6
        with:
          name: Dart-Analyzer-Reports
          path: analyzer-report.txt

  ############################################################
  # TESTS
  ############################################################

  run_tests:
    name: Run Flutter Tests & Coverage
    runs-on: ubuntu-latest
    needs: build_flutter_project
    if: ${{ inputs.run_tests }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: Darryl-Cardoza/flutter-reusable-repo/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      ######################################################
      # CHECK IF TEST FILES EXIST
      ######################################################

      - name: Check if Test Files Exist
        id: check_tests
        run: |
          if [ -z "$(find test -name '*_test.dart' 2>/dev/null)" ]; then
            echo "⚠️ No test files found"
            echo "tests_exist=false" >> $GITHUB_OUTPUT
          else
            echo "tests_exist=true" >> $GITHUB_OUTPUT
          fi

      ######################################################
      # RUN TESTS
      ######################################################

      - name: Run Flutter Tests
        if: steps.check_tests.outputs.tests_exist == 'true'
        run: |
          mkdir -p /tmp/test-results
          mkdir -p /tmp/coverage
          
          flutter test \
            --coverage \
            --machine \
            > /tmp/test-results/test-output.json || true

      ######################################################
      # WARN IF TESTS MISSING
      ######################################################

      - name: Warn if No Tests
        if: steps.check_tests.outputs.tests_exist == 'false'
        run: |
          echo "⚠️ No tests detected in project"
          echo "Pipeline will continue"

      ######################################################
      # GENERATE JUNIT
      ######################################################

      - name: Generate JUnit Report
        if: steps.check_tests.outputs.tests_exist == 'true'
        run: |
          dart .github/tool/json_to_junit.dart \
            /tmp/test-results/test-output.json \
            /tmp/test-results/junit.xml

      ######################################################
      # COVERAGE HTML
      ######################################################

      - name: Generate Coverage HTML
        if: steps.check_tests.outputs.tests_exist == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          genhtml coverage/lcov.info --output-directory /tmp/coverage/html || true

      ######################################################
      # COVERAGE THRESHOLD
      ######################################################

      - name: Enforce Coverage Threshold
        if: ${{ inputs.enforce_coverage }}
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "⚠️ Coverage file not generated"
            echo "Pipeline continuing"
            exit 0
          fi
          
          COVERAGE=$(lcov --summary coverage/lcov.info | grep lines | awk '{print $2}' | sed 's/%//')
          REQUIRED=${{ inputs.coverage_threshold }}
          
          echo "Coverage: $COVERAGE%"
          
          if (( $(echo "$COVERAGE < $REQUIRED" | bc -l) )); then
            echo "❌ Coverage below threshold ($REQUIRED%)"
            exit 1
          fi

      ######################################################
      # ARTIFACTS
      ######################################################

      - name: Upload Test Reports
        if: steps.check_tests.outputs.tests_exist == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: /tmp/test-results

      - name: Upload Coverage Reports
        if: steps.check_tests.outputs.tests_exist == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: /tmp/coverage


  ############################################################
  # ANDROID BUILD
  ############################################################

  build_android:
    name: Build Android
    runs-on: ${{ inputs.build_android || inputs.android_runner }}
    needs: dart_analyzer

    steps:
      - uses: actions/checkout@v6

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: Rite-Technologies-23/ops-rite-flutter-cicd/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --build-name=${{ inputs.version_name }} --build-number=1

      - name: Build AAB
        run: |
          flutter build appbundle --release --build-name=${{ inputs.version_name }} --build-number=1

      - name: Upload Android Outputs
        uses: actions/upload-artifact@v6
        with:
          name: android-build
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/*.aab

  ############################################################
  # IOS BUILD
  ############################################################

  build_ios:
    name: Build iOS (UNSIGNED ARCHIVE)
    runs-on: ${{ inputs.ios_runner }}
    needs: dart_analyzer
    if: ${{ inputs.build_ios }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate Bundle ID
        run: |
          if [ -z "${{ inputs.ios_bundle_id }}" ]; then
            echo "❌ ios_bundle_id required when build_ios=true"
            exit 1
          fi

      - name: Setup Flutter
        uses: Rite-Technologies-23/ops-rite-flutter-cicd/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version }}
          flutter_channel: ${{ inputs.flutter_channel }}

      - name: Build iOS Archive
        run: |
          set -e
          
          ARCHIVE_DIR="$RUNNER_TEMP/ios-archive"
          ARCHIVE_PATH="$ARCHIVE_DIR/Runner.xcarchive"
          
          mkdir -p "$ARCHIVE_DIR"
          
          flutter build ios --release --no-codesign
          
          cd ios
          
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            archive
          
          cd ..
          
          test -d "$ARCHIVE_PATH"

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v6
        with:
          name: ios-archive-unsigned
          path: ${{ runner.temp }}/ios-archive