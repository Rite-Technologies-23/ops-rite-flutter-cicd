name: "Reusable Flutter CD"

on:
  workflow_call:
    inputs:
      flutter_version:
        required: false
        type: string
        default: "3.35.5"

      flutter_channel:
        required: false
        type: string
        default: "stable"

      version:
        required: true
        type: string

      deploy_to_cloud:
        required: false
        type: boolean
        default: false

      enable_aws:
        required: false
        type: boolean
        default: false

      terraform_working_dir:
        required: false
        type: string
        default: './terraform'

      deploy_to_playstore:
        required: false
        type: boolean
        default: false

      playstore_track:
        required: false
        type: string
        default: internal

      playstore_status:
        required: false
        type: string
        default: completed

      package_name:
        required: true
        type: string

      playstore_metadata_path:
        required: false
        type: string
        default: playstore/metadata

      playstore_images_path:
        required: false
        type: string
        default: playstore/images

      deploy_to_esper_android:
        required: false
        type: boolean
        default: false

      deploy_to_esper_ios:
        required: false
        type: boolean
        default: false

      esper_org_id:
        required: false
        type: string
        default: ""

      esper_tenant:
        required: false
        type: string
        default: "api"

      deploy_to_testflight:
        required: false
        type: boolean
        default: false

      ios_bundle_id:
        required: false
        type: string
        default: ''

      build_number:
        required: false
        type: string
        default: '1'

      enable_whats_new:
        required: false
        type: boolean
        default: false

      whats_new_file:
        required: false
        type: string
        default: ''

      android_runner:
        required: false
        type: string
        default: ubuntu-latest

      ios_runner:
        required: false
        type: string
        default: macos-latest

    secrets:
      # AWS Secrets (optional)
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false

      # Android Signing
      ANDROID_KEYSTORE:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      PLAYSTORE_SERVICE_ACCOUNT:
        required: false

      # iOS Signing
      IOS_TEAM_ID:
        required: false
      IOS_CERT_P12_BASE64:
        required: false
      IOS_CERT_PASSWORD:
        required: false
      IOS_PROVISION_PROFILE_BASE64:
        required: false

      # App Store Connect Credentials
      APPSTORE_ISSUER_ID:
        required: false
      APPSTORE_KEY_ID:
        required: false
      APPSTORE_PRIVATE_KEY:
        required: false

      # Esper Credentials
      ESPER_API_KEY:
        required: false


jobs:
  # CREATE GITHUB RELEASE
  create_release:
    name: Create GitHub Release
    runs-on: ${{ inputs.android_runner }}
    outputs:
      version: ${{ steps.version_check.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download unsigned Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: release/android

      - name: Download unsigned iOS archive
        uses: actions/download-artifact@v4
        with:
          name: ios-archive-unsigned
          path: release/ios

      - name: Determine next GitHub version
        id: version_check
        run: |
          BASE_VERSION="${{ inputs.version }}"
          git fetch --tags
          CURRENT_VERSION="$BASE_VERSION"

          while git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; do
            IFS='.' read -r major minor patch <<<"$CURRENT_VERSION"
            patch=$((patch + 1))
            CURRENT_VERSION="$major.$minor.$patch"
          done

          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version_check.outputs.version }}
          name: Release v${{ steps.version_check.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SIGN ANDROID
  sign_android:
    name: Sign Android
    if: ${{ inputs.deploy_to_playstore || inputs.deploy_to_esper_android }}
    needs: create_release
    runs-on: ${{ inputs.android_runner }}

    steps:
      - name: Download unsigned Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: release/android

      - name: Install Android build-tools (zipalign/apksigner)
        uses: android-actions/setup-android@v3

      - name: Install Build Tools 34.0.0
        run: |
          set -e
          sdkmanager "build-tools;34.0.0" "platform-tools" >/dev/null
          echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Verify tools
        run: |
          which zipalign
          which apksigner
          zipalign -h | head -n 1
          apksigner --version


      - name: Decode Keystore
        run: |
          set -e
          mkdir -p /tmp/android
          printf "%s" "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > /tmp/android/upload-keystore.jks

      - name: Sign APK
        run: |
          set -e
          APK=$(find release/android -name "*release*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No release APK found under release/android"
            find release/android -maxdepth 4 -type f
            exit 1
          fi

          zipalign -f 4 "$APK" /tmp/aligned.apk

          apksigner sign \
            --ks /tmp/android/upload-keystore.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out release/android/app-release-signed.apk \
            /tmp/aligned.apk

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android-signed
          path: release/android/app-release-signed.apk

  # DEPLOY TO PLAY STORE
  deploy_playstore:
    name: Deploy to Google Play Store
    if: ${{ inputs.deploy_to_playstore }}
    needs: sign_android
    runs-on: ${{ inputs.android_runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: Rite-Technologies-23/ops-rite-flutter-cicd/.github/actions/setup-flutter@main
        with:
          flutter_version: ${{ inputs.flutter_version}}
          flutter_channel: ${{ inputs.flutter_channel}}

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build RELEASE AAB (signed)
        run: |
          flutter build appbundle --release \
            --build-name=${{ inputs.version }} \
            --build-number=${{ inputs.build_number }}
          
      - name: Prepare Play Store "What's New" (whatsNewDirectory)
        if: ${{ inputs.enable_whats_new }}
        run: |
          set -e

          if [ -z "${{ inputs.whats_new_file }}" ]; then
            echo "❌ whats_new_file not provided"
            exit 1
          fi

          if [ ! -f "${{ inputs.whats_new_file }}" ]; then
            echo "❌ File not found: ${{ inputs.whats_new_file }}"
            exit 1
          fi

          LANG="en-US"
          mkdir -p "$RUNNER_TEMP/whatsnew/${LANG}"
          cp "${{ inputs.whats_new_file }}" "$RUNNER_TEMP/whatsnew/${LANG}/whatsnew"

          echo "✅ whatsNewDirectory prepared at: $RUNNER_TEMP/whatsnew"

      - name: Upload to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: build/app/outputs/bundle/release/*.aab
          track: ${{ inputs.playstore_track }}
          status: ${{ inputs.playstore_status }}
          inAppUpdatePriority: 2
          whatsNewDirectory: ${{ inputs.enable_whats_new && format('{0}/whatsnew', runner.temp) || '' }}

  # SIGN iOS (EXPORT IPA FROM ARCHIVE)
  sign_ios:
    name: Sign iOS & Export IPA
    if: ${{ inputs.deploy_to_testflight || inputs.deploy_to_esper_ios }}
    needs: create_release
    runs-on: ${{ inputs.ios_runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Download unsigned iOS archive
        uses: actions/download-artifact@v4
        with:
          name: ios-archive-unsigned
          path: release/ios

      - name: Install certificate & profile
        env:
          P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD="temp"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"

          # ✅ make Xcode/codesign actually search this keychain
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          # ✅ allow non-interactive signing
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "✅ Installed provisioning profile UUID: $UUID"

          echo "🔎 Identities found:"
          security find-identity -p codesigning -v
    

      - name: Verify signing identities
        run: |
          set -e
          echo "🔎 Available code signing identities:"
          security find-identity -p codesigning -v
          
          echo "🔎 Keychains:"
          security list-keychains -d user
          
          echo "🔎 Default keychain:"
          security default-keychain -d user

      - name: Generate ExportOptions.plist
        run: |
          set -e
          if [ -z "${{ inputs.ios_bundle_id }}" ]; then
            echo "❌ inputs.ios_bundle_id required for iOS export"
            exit 1
          fi
          if [ -z "${{ secrets.IOS_TEAM_ID }}" ]; then
            echo "❌ inputs.ios_team_id required for manual signing"
            exit 1
          fi
          
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
  
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>method</key>
          <string>app-store-connect</string>
        
          <key>signingStyle</key>
          <string>manual</string>
        
          <key>teamID</key>
          <string>${{ secrets.IOS_TEAM_ID }}</string>
        
          <key>provisioningProfiles</key>
          <dict>
          <key>${{ inputs.ios_bundle_id }}</key>
          <string>${PROFILE_NAME}</string>
          </dict>
        
          <key>compileBitcode</key>
          <false/>
        
          <key>stripSwiftSymbols</key>
          <true/>
          </dict>
          </plist>
          EOF
          

      - name: Export IPA
        run: |
          set -e

          echo "Listing release/ios:"
          ls -la release/ios || true
          find release/ios -maxdepth 5 -print || true

          ARCHIVE=$(find release/ios -type d -name "*.xcarchive" | head -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "No .xcarchive directory found in release/ios"
            exit 1
          fi

          echo "Using archive: $ARCHIVE"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Verify embedded.mobileprovision exists
        run: |
          set -e
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n 1)
          rm -rf /tmp/ipa_check
          mkdir -p /tmp/ipa_check
          unzip -q "$IPA" -d /tmp/ipa_check
          APP=$(find /tmp/ipa_check/Payload -maxdepth 1 -name "*.app" | head -n 1)
          test -f "$APP/embedded.mobileprovision" || (echo "❌ embedded.mobileprovision missing"; exit 1)
          echo "✅ embedded.mobileprovision found"


      - name: Upload signed IPA
        uses: actions/upload-artifact@v6
        with:
          name: ios-ipa-signed
          path: ${{ runner.temp }}/export/*.ipa

  # DEPLOY TO TESTFLIGHT
  deploy_testflight:
    name: Deploy to TestFlight
    if: ${{ inputs.deploy_to_testflight }}
    needs: sign_ios
    runs-on: ${{ inputs.ios_runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Download signed IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-signed
          path: release/ios

      # ✅ Pin Ruby (avoid /opt/homebrew Ruby/OpenSSL issues)
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"   # 3.2 is very stable with fastlane
          bundler-cache: false

      - name: Install fastlane
        run: gem install fastlane -N

      # (Optional) print versions for debugging
      - name: Debug Ruby/OpenSSL/Fastlane
        run: |
          ruby -v
          which ruby
          ruby -ropenssl -e 'puts OpenSSL::OPENSSL_VERSION'
          fastlane --version

      - name: Upload to TestFlight
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -e

          IPA=$(find release/ios -name "*.ipa" | head -n 1)
          if [ -z "$IPA" ]; then
            echo "❌ No IPA found in release/ios"
            find release/ios -maxdepth 6 -type f
            exit 1
          fi

          echo "$APPSTORE_PRIVATE_KEY" | base64 --decode > AuthKey.p8
          perl -pi -e 's/\r\n/\n/g' AuthKey.p8

          KEY_ESCAPED=$(python3 - <<'PY'
          import json
          p = open("AuthKey.p8", "r", encoding="utf-8").read()
          print(json.dumps(p)[1:-1])
          PY
          )

          cat > api_key.json <<EOF
          {
            "key_id": "${APPSTORE_KEY_ID}",
            "issuer_id": "${APPSTORE_ISSUER_ID}",
            "key": "${KEY_ESCAPED}",
            "in_house": false
          }
          EOF

          CHANGELOG=""
          if [ "${{ inputs.enable_whats_new }}" = "true" ]; then
            if [ -z "${{ inputs.whats_new_file }}" ]; then
              echo "❌ whats_new_file not provided"
              exit 1
            fi
            if [ ! -f "${{ inputs.whats_new_file }}" ]; then
              echo "❌ File not found: ${{ inputs.whats_new_file }}"
              exit 1
            fi
            CHANGELOG="$(cat "${{ inputs.whats_new_file }}")"
          fi

          # ✅ IMPORTANT:
          # Use --distribute_external for external testers (optional)
          # For internal testers, groups must exist in App Store Connect.
          #
          # If your group name is different, change "Internal" to your group name.
          #GROUP_NAME="Internal"

          if [ -n "$CHANGELOG" ]; then
            fastlane pilot upload \
              --ipa "$IPA" \
              --api_key_path api_key.json \
              --skip_waiting_for_build_processing true \
              --changelog "$CHANGELOG"
          else
            fastlane pilot upload \
              --ipa "$IPA" \
              --api_key_path api_key.json \
              --skip_waiting_for_build_processing true
          fi


  deploy_esper:
    name: Deploy to Esper
    if: ${{ inputs.deploy_to_esper_android || inputs.deploy_to_esper_ios }}
    needs:
      - sign_android
      - sign_ios
    runs-on: ${{ inputs.ios_runner }}

    steps:
      - name: Download signed Android APK
        if: ${{ inputs.deploy_to_esper_android }}
        uses: actions/download-artifact@v4
        with:
          name: android-signed
          path: release/android
        continue-on-error: true

      - name: Download signed iOS IPA
        if: ${{ inputs.deploy_to_esper_ios }}
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-signed
          path: release/ios
        continue-on-error: true

      - name: Check Esper credentials
        env:
          ESPER_API_KEY: ${{ secrets.ESPER_API_KEY }}
          ESPER_ORG_ID: ${{ inputs.esper_org_id }}
          ESPER_TENANT: ${{ inputs.esper_tenant }}
        run: |
          set -euo pipefail
          
          if [ -z "${ESPER_API_KEY}" ]; then
            echo "❌ ESPER_API_KEY is missing"
            exit 1
          fi
          
          if [ -z "${ESPER_TENANT}" ]; then
            echo "❌ esper_tenant input is missing"
            exit 1
          fi
          
          echo "✅ Esper credentials look present"

      - name: Check available app artifacts
        id: artifact_check
        run: |
          set -euo pipefail
          
          ANDROID_APK=""
          IOS_IPA=""
          
          if [ -d "release/android" ]; then
            ANDROID_APK=$(find release/android -name "*.apk" | head -n 1 || true)
          fi
          
          if [ -d "release/ios" ]; then
            IOS_IPA=$(find release/ios -name "*.ipa" | head -n 1 || true)
          fi
          
          if [ -n "$ANDROID_APK" ]; then
            echo "android_available=true" >> "$GITHUB_OUTPUT"
            echo "android_apk=$ANDROID_APK" >> "$GITHUB_OUTPUT"
            echo "✅ Android artifact found: $ANDROID_APK"
          else
            echo "android_available=false" >> "$GITHUB_OUTPUT"
            echo "android_apk=" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No Android APK found"
          fi
          
          if [ -n "$IOS_IPA" ]; then
            echo "ios_available=true" >> "$GITHUB_OUTPUT"
            echo "ios_ipa=$IOS_IPA" >> "$GITHUB_OUTPUT"
            echo "✅ iOS artifact found: $IOS_IPA"
          else
            echo "ios_available=false" >> "$GITHUB_OUTPUT"
            echo "ios_ipa=" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No iOS IPA found"
          fi
          
          if [ "${{ inputs.deploy_to_esper_android }}" = "true" ] && [ -z "$ANDROID_APK" ]; then
            echo "❌ Android deployment requested but APK not found"
            exit 1
          fi
          
          if [ "${{ inputs.deploy_to_esper_ios }}" = "true" ] && [ -z "$IOS_IPA" ]; then
            echo "❌ iOS deployment requested but IPA not found"
            exit 1
          fi

      - name: Deploy Android to Esper
        if: ${{ inputs.deploy_to_esper_android && steps.artifact_check.outputs.android_available == 'true' }}
        env:
          ESPER_API_KEY: ${{ secrets.ESPER_API_KEY }}
          ESPER_ORG_ID: ${{ inputs.esper_org_id }}
          ESPER_TENANT: ${{ inputs.esper_tenant }}
          APK_PATH: ${{ steps.artifact_check.outputs.android_apk }}
        run: |
          set -euo pipefail
          
          API_URL="https://${ESPER_TENANT}-api.esper.cloud/api/enterprise/${ESPER_ORG_ID}/application/upload/"
          
          echo "Uploading Android APK: $APK_PATH"
          echo "API URL: $API_URL"
          
          HTTP_STATUS=$(curl -L -sS -w "%{http_code}" \
            -X POST "$API_URL" \
            -H "Authorization: Bearer ${ESPER_API_KEY}" \
            -H "Accept: application/json" \
            -F "app_file=@${APK_PATH}" \
            -o esper_android_response.json)
          
          echo "Esper Android response:"
          cat esper_android_response.json || true
          echo
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "❌ Esper Android upload failed"
            exit 1
          fi
          
          echo "✅ Esper Android upload successful"

      - name: Deploy iOS to Esper
        if: ${{ inputs.deploy_to_esper_ios && steps.artifact_check.outputs.ios_available == 'true' }}
        env:
          ESPER_API_KEY: ${{ secrets.ESPER_API_KEY }}
          ESPER_TENANT: ${{ inputs.esper_tenant }}
          IOS_IPA_PATH: ${{ steps.artifact_check.outputs.ios_ipa }}
        run: |
          set -euo pipefail
          
          API_URL="https://${ESPER_TENANT}-api.esper.cloud/api/v2/tenant-apps"
          
          echo "Uploading iOS IPA: $IOS_IPA_PATH"
          echo "API URL: $API_URL"
          
          HTTP_STATUS=$(curl -L -sS -w "%{http_code}" \
            -X POST "$API_URL" \
            -H "Authorization: Bearer ${ESPER_API_KEY}" \
            -H "Accept: application/json" \
            -F "platform=ios" \
            -F "file=@${IOS_IPA_PATH}" \
            -o esper_ios_response.json)
          
          echo "Esper iOS response:"
          cat esper_ios_response.json || true
          echo
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "❌ Esper iOS upload failed"
            exit 1
          fi
          
          echo "✅ Esper iOS upload successful"