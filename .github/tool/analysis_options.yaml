# Shared analyzer config, used only when the caller repo has no
# analysis_options.yaml of its own. Self-contained on purpose: an
# `include: package:flutter_lints/...` would fail in repos that don't depend
# on that package.

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "build/**"
    - ".dart_tool/**"
  # strict-casts / strict-inference / strict-raw-types are deliberately off
  # here: they turn into errors on most existing codebases. Enable them in
  # your own analysis_options.yaml once the backlog is cleared.
  errors:
    # Dead code surfaces in the Lint stage.
    unused_import: warning
    unused_element: warning
    unused_field: warning
    unused_local_variable: warning
    dead_code: warning

linter:
  rules:
    # Correctness
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - empty_statements
    - hash_and_equals
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - no_duplicate_case_values
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements
    - unrelated_type_equality_checks
    - use_build_context_synchronously
    - valid_regexps
    # Style (the flutter_lints core, inlined)
    - annotate_overrides
    - avoid_empty_else
    - avoid_init_to_null
    - avoid_unnecessary_containers
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_is_empty
    - prefer_is_not_empty
    - sized_box_for_whitespace
    - use_key_in_widget_constructors
    - unnecessary_this
    - unnecessary_new
